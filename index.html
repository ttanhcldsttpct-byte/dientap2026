<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đếm ngược - Diễn tập ứng phó sự cố bức xạ và hạt nhân 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1220;--card:#131c2e;--line:#2a3a57;--text:#f2f5fa;--muted:#9fb0cc;--accent:#ffc400;--danger:#e53935}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#16233d 0%,var(--bg) 60%);color:var(--text);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:1100px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.trefoil{width:22px;height:22px}
h1{margin:22px 0 10px;font-size:clamp(18px,3.1vw,38px);line-height:1.25;text-transform:uppercase;letter-spacing:.02em}
h1 .hl{color:var(--accent)}
@media(min-width:700px){h1 .l1{white-space:nowrap}}
.when{color:var(--muted);font-size:clamp(15px,2.4vw,20px);margin:0 0 34px}
.when b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,20px)}
.box{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:14px;padding:clamp(14px,3vw,30px) 6px}
.num{font-size:clamp(34px,9vw,84px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.lab{margin-top:10px;color:var(--muted);font-size:clamp(11px,2vw,16px);text-transform:uppercase;letter-spacing:.12em}
.status{margin-top:34px;font-size:clamp(16px,2.6vw,22px);font-weight:600;color:var(--muted)}
.live .status,.live .box{color:var(--danger)}
.live .box{border-top-color:var(--danger)}
.live .status{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="badge">
    <svg class="trefoil" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><path d="M12 9.6 7.4 1.6A11 11 0 0 1 16.6 1.6z" transform="translate(0 0)"/><path d="M12 9.6 7.4 1.6A11 11 0 0 1 16.6 1.6z" transform="rotate(120 12 12)"/><path d="M12 9.6 7.4 1.6A11 11 0 0 1 16.6 1.6z" transform="rotate(240 12 12)"/></svg>
    Thông báo
  </div>
  <h1><span class="l1">Diễn tập ứng phó sự cố <span class="hl">bức xạ và hạt nhân</span></span><br>trên địa bàn thành phố năm 2026</h1>
  <p class="when">Thời gian bắt đầu: <b>7 giờ 30 phút, ngày 20/11/2026</b> (ngày cuối cùng: 20/11/2026)</p>
  <div class="grid">
    <div class="box"><div class="num" id="d">00</div><div class="lab">Ngày</div></div>
    <div class="box"><div class="num" id="h">00</div><div class="lab">Giờ</div></div>
    <div class="box"><div class="num" id="m">00</div><div class="lab">Phút</div></div>
    <div class="box"><div class="num" id="s">00</div><div class="lab">Giây</div></div>
  </div>
  <div class="status" id="status">Thời gian còn lại đến buổi diễn tập</div>
  <footer>Giờ Việt Nam (GMT+7)</footer>
</main>
<script>
(function(){
  var start=new Date("2026-11-20T07:30:00+07:00").getTime();
  var end=new Date("2026-11-20T23:59:59+07:00").getTime();
  var el={d:document.getElementById("d"),h:document.getElementById("h"),m:document.getElementById("m"),s:document.getElementById("s")};
  var st=document.getElementById("status"),app=document.getElementById("app");
  function p(n){return String(n).padStart(2,"0")}
  function tick(){
    var now=Date.now(),diff=start-now;
    if(diff<=0){
      el.d.textContent=el.h.textContent=el.m.textContent=el.s.textContent="00";
      if(now<=end){app.classList.add("live");st.textContent="BUỔI DIỄN TẬP ĐANG DIỄN RA";}
      else{app.classList.remove("live");st.textContent="Buổi diễn tập đã kết thúc";clearInterval(t);}
      return;
    }
    var s=Math.floor(diff/1000);
    el.d.textContent=p(Math.floor(s/86400));
    el.h.textContent=p(Math.floor(s%86400/3600));
    el.m.textContent=p(Math.floor(s%3600/60));
    el.s.textContent=p(s%60);
  }
  tick();
  var t=setInterval(tick,1000);
})();
</script>
</body>
</html>
